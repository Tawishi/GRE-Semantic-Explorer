        // --- Master Library Logic ---
        let masterLibrary = [];

        async function loadLibrary() {
            try {
                const response = await fetch('words.json');
                if (!response.ok) throw new Error('File not found');
                masterLibrary = await response.json();
                document.getElementById('stat-total').innerText = masterLibrary.length;
            } catch (e) {
                console.warn("words.json not found. Search will use curated list only.");
            }
        }

        // --- Core Functions ---
        function switchTab(tabId) {
            ['overview', 'synonyms', 'antonyms', 'malapropisms'].forEach(id => {
                const section = document.getElementById(`section-${id}`);
                const tab = document.getElementById(`tab-${id}`);
                if (section && tab) {
                    section.classList.add('hidden');
                    tab.classList.remove('tab-active');
                    tab.classList.add('tab-inactive');
                }
            });
            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            const activeTab = document.getElementById(`tab-${tabId}`);
            activeTab.classList.remove('tab-inactive');
            activeTab.classList.add('tab-active');
            clearSearch(false);
        }

        function handleSearch(query) {
            query = query.toLowerCase().trim();
            const panel = document.getElementById('searchResults');
            const content = document.getElementById('searchContent');
            if (query.length < 2) { panel.classList.add('hidden'); return; }

            let html = '';
            let count = 0;

            masterLibrary.forEach(item => {
                if (item.word.toLowerCase().includes(query) || item.def.toLowerCase().includes(query)) {
                    html += `<div class="bg-white p-4 rounded-lg border border-sky-100 shadow-sm">
                        <h4 class="font-bold text-sky-900 serif-font">${item.word} <span class="text-xs font-normal text-stone-400">(${item.pos})</span></h4>
                        <p class="text-sm text-stone-700 mt-1">${item.def}</p>
                        <p class="text-xs italic text-stone-500 mt-2">"${item.ex}"</p>
                    </div>`;
                    count++;
                }
            });

            content.innerHTML = count > 0 ? html : `<p class="text-stone-500 italic">No matches found in library.</p>`;
            panel.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearSearch(clearInputs = true) {
            document.getElementById('searchResults').classList.add('hidden');
            if(clearInputs) {
                document.getElementById('searchInput').value = '';
                document.getElementById('mobileSearchInput').value = '';
            }
        }

        // --- Render Helpers ---
        function renderSynonyms() {
            const sidebar = document.getElementById('synonym-sidebar');
            greData.synonyms.forEach((g, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-4 py-3 rounded-lg border bg-white hover:bg-sky-50 transition-all mb-2';
                btn.innerHTML = `${g.icon} <span class="font-medium text-stone-700">${g.theme}</span>`;
                btn.onclick = () => renderDetails(i);
                sidebar.appendChild(btn);
            });
        }

        function renderDetails(index) {
            const group = greData.synonyms[index];
            document.getElementById('synonym-details').innerHTML = `
                <div class="mb-6 border-b pb-4"><h3 class="text-2xl font-bold">${group.icon} ${group.theme}</h3></div>
                <div class="space-y-4">${group.words.map(w => `
                    <div class="p-4 rounded bg-stone-50 border">
                        <h4 class="text-xl font-bold text-sky-800 serif-font">${w.word}</h4>
                        <p class="text-stone-800 my-1">${w.def}</p>
                        <div class="text-xs bg-amber-50 p-2 border-l-4 border-amber-400 text-stone-600"><strong>Nuance:</strong> ${w.nuance}</div>
                    </div>`).join('')}
                </div>`;
        }

        function initChart() {
            const ctx = document.getElementById('themeChart').getContext('2d');
            new Chart(ctx, {
                type: 'polarArea',
                data: {
                    labels: greData.synonyms.map(g => g.theme),
                    datasets: [{ data: greData.synonyms.map(g => g.words.length), backgroundColor: ['#0ea5e9', '#f59e0b', '#10b981'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadLibrary();
            renderSynonyms();
            initChart();
            document.getElementById('searchInput').addEventListener('input', e => handleSearch(e.target.value));
            document.getElementById('mobileSearchInput').addEventListener('input', e => handleSearch(e.target.value));
        });
    </script>
</body>
</html>
