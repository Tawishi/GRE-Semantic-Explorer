<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRE Semantic Explorer | Master Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fafaf9; color: #1c1917; }
        h1, h2, h3, .serif-font { font-family: 'Playfair Display', serif; }
        .chart-container { position: relative; width: 100%; max-width: 800px; margin: auto; height: 350px; }
        .tab-active { border-bottom: 3px solid #0369a1; color: #0369a1; font-weight: 600; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #78716c; }
        .tab-inactive:hover { color: #44403c; border-bottom: 3px solid #d6d3d1; }
        .animate-fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-stone-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🎓</span>
                <h1 class="text-xl font-bold text-stone-800 tracking-tight">GRE Semantic <span class="text-sky-700">Explorer</span></h1>
            </div>
            <div class="relative w-64 hidden md:block">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">🔍</span>
                <input type="text" id="searchInput" placeholder="Search 1,000+ words..." class="w-full pl-10 pr-4 py-2 rounded-full border border-stone-300 bg-stone-50 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all text-sm">
            </div>
        </div>
        
        <div class="md:hidden px-4 pb-3">
             <div class="relative w-full">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">🔍</span>
                <input type="text" id="mobileSearchInput" placeholder="Search 1,000+ words..." class="w-full pl-10 pr-4 py-2 rounded-lg border border-stone-300 bg-stone-50 focus:outline-none focus:ring-2 focus:ring-sky-500 text-sm">
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex space-x-8 overflow-x-auto no-scrollbar">
                <button onclick="switchTab('overview')" id="tab-overview" class="tab-active whitespace-nowrap py-3 px-1 text-sm">📊 Overview</button>
                <button onclick="switchTab('synonyms')" id="tab-synonyms" class="tab-inactive whitespace-nowrap py-3 px-1 text-sm">🔗 Synonyms</button>
                <button onclick="switchTab('antonyms')" id="tab-antonyms" class="tab-inactive whitespace-nowrap py-3 px-1 text-sm">⚖️ Antonyms</button>
                <button onclick="switchTab('malapropisms')" id="tab-malapropisms" class="tab-inactive whitespace-nowrap py-3 px-1 text-sm">🎭 Traps</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <!-- Search Results Panel -->
        <div id="searchResults" class="hidden mb-8 p-6 bg-sky-50 border border-sky-200 rounded-xl shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-sky-900">Search Results</h2>
                <button onclick="clearSearch()" class="text-sky-600 hover:text-sky-800 text-sm font-medium">✕ Clear</button>
            </div>
            <div id="searchContent" class="space-y-4"></div>
        </div>

        <!-- Section: Overview -->
        <section id="section-overview" class="block animate-fade-in">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100 flex items-center gap-4">
                    <div class="text-4xl">📚</div>
                    <div>
                        <div class="text-2xl font-bold text-stone-800" id="stat-total">0</div>
                        <div class="text-sm text-stone-500 uppercase tracking-wide">Library Words</div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100 flex items-center gap-4">
                    <div class="text-4xl">🔗</div>
                    <div>
                        <div class="text-2xl font-bold text-stone-800" id="stat-clusters">10</div>
                        <div class="text-sm text-stone-500 uppercase tracking-wide">Semantic Clusters</div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100 flex items-center gap-4">
                    <div class="text-4xl">⚖️</div>
                    <div>
                        <div class="text-2xl font-bold text-stone-800" id="stat-pairs">6</div>
                        <div class="text-sm text-stone-500 uppercase tracking-wide">Key Contrasts</div>
                    </div>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100">
                <h3 class="text-lg font-semibold text-stone-800 mb-4 text-center">High-Yield Study Clusters</h3>
                <div class="chart-container">
                    <canvas id="themeChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Section: Synonyms -->
        <section id="section-synonyms" class="hidden animate-fade-in">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/3 flex flex-col gap-2 h-[60vh] overflow-y-auto pr-2" id="synonym-sidebar"></div>
                <div class="w-full md:w-2/3 bg-white p-6 rounded-xl shadow-sm border border-stone-200 min-h-[60vh]" id="synonym-details">
                    <div class="flex flex-col items-center justify-center h-full text-stone-400 text-center">
                        <span class="text-5xl mb-4">👈</span>
                        <p class="text-lg">Select a theme to explore GRE synonym pairs.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Section: Antonyms -->
        <section id="section-antonyms" class="hidden animate-fade-in">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6" id="antonym-grid"></div>
        </section>

        <!-- Section: Malapropisms -->
        <section id="section-malapropisms" class="hidden animate-fade-in">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="malapropism-grid"></div>
        </section>
    </main>

    <script>
        // --- Data Definitions ---
        const greData = {
            synonyms: [
                {
                    theme: "Criticize, Scold, or Reprove",
                    icon: "🗣️",
                    words: [
                        { word: "Castigate", def: "Reprimand harshly.", nuance: "Severe, often public discipline." },
                        { word: "Chastise", def: "Reprimand severely.", nuance: "Strong verbal discipline." },
                        { word: "Excoriate", def: "To criticize very harshly.", nuance: "Stinging public disapproval." },
                        { word: "Upbraid", def: "To reproach or scold.", nuance: "Finding fault with behavior." }
                    ]
                },
                {
                    theme: "Stubborn or Inflexible",
                    icon: "🧱",
                    words: [
                        { word: "Obdurate", def: "Stubbornly persistent in changing an opinion.", nuance: "Hardened against persuasion." },
                        { word: "Intransigent", def: "Unwilling to change one's beliefs.", nuance: "Refusal to compromise in negotiations." },
                        { word: "Adamant", def: "Refusing to change one's mind.", nuance: "Unyielding resolve." }
                    ]
                },
                {
                    theme: "Wealthy or Generous",
                    icon: "💰",
                    words: [
                        { word: "Affluent", def: "Wealthy.", nuance: "Possessing material riches." },
                        { word: "Munificent", def: "Very generous (with money).", nuance: "Lavish giving." },
                        { word: "Magnanimous", def: "Noble and generous in spirit.", nuance: "Generosity toward a rival." }
                    ]
                }
            ],
            antonyms: [
                { pair: ["Mitigate", "Exacerbate"], concept: "Severity", word1Def: "Make less severe.", word2Def: "Make worse.", example: "Medicine can <strong>mitigate</strong> pain, or a reaction can <strong>exacerbate</strong> it." },
                { pair: ["Ephemeral", "Perennial"], concept: "Duration", word1Def: "Lasting a short time.", word2Def: "Lasting indefinitely.", example: "Trends are <strong>ephemeral</strong>; classics are <strong>perennial</strong>." }
            ],
            malapropisms: [
                { word: "Enervate", soundsLike: "Energize", actualMeaning: "To sap energy from.", example: "The sun <strong>enervated</strong> him." },
                { word: "Ingenuous", soundsLike: "Ingenious", actualMeaning: "Naive and innocent.", example: "Her <strong>ingenuous</strong> belief made her a target." }
            ]
        };

        // --- Master Library Logic ---
        let masterLibrary = [];

        async function loadLibrary() {
            try {
                const response = await fetch('words.json');
                if (!response.ok) throw new Error('File not found');
                masterLibrary = await response.json();
                document.getElementById('stat-total').innerText = masterLibrary.length;
            } catch (e) {
                console.warn("words.json not found. Search will use curated list only.");
            }
        }

        // --- Core Functions ---
        function switchTab(tabId) {
            ['overview', 'synonyms', 'antonyms', 'malapropisms'].forEach(id => {
                document.getElementById(`section-${id}`).classList.add('hidden');
                document.getElementById(`tab-${id}`).classList.replace('tab-active', 'tab-inactive');
            });
            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.replace('tab-inactive', 'tab-active');
            clearSearch(false);
        }

        function handleSearch(query) {
            query = query.toLowerCase().trim();
            const panel = document.getElementById('searchResults');
            const content = document.getElementById('searchContent');
            if (query.length < 2) { panel.classList.add('hidden'); return; }

            let html = '';
            let count = 0;

            // Search Master Library
            masterLibrary.forEach(item => {
                if (item.word.toLowerCase().includes(query) || item.def.toLowerCase().includes(query)) {
                    html += `<div class="bg-white p-4 rounded-lg border border-sky-100 shadow-sm">
                        <h4 class="font-bold text-sky-900 serif-font">${item.word} <span class="text-xs font-normal text-stone-400">(${item.pos})</span></h4>
                        <p class="text-sm text-stone-700 mt-1">${item.def}</p>
                        <p class="text-xs italic text-stone-500 mt-2">"${item.ex}"</p>
                    </div>`;
                    count++;
                }
            });

            content.innerHTML = count > 0 ? html : `<p class="text-stone-500 italic">No matches found in library.</p>`;
            panel.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function clearSearch(clearInputs = true) {
            document.getElementById('searchResults').classList.add('hidden');
            if(clearInputs) {
                document.getElementById('searchInput').value = '';
                document.getElementById('mobileSearchInput').value = '';
            }
        }

        // --- Render Helpers ---
        function renderSynonyms() {
            const sidebar = document.getElementById('synonym-sidebar');
            greData.synonyms.forEach((g, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-4 py-3 rounded-lg border bg-white hover:bg-sky-50 transition-all';
                btn.innerHTML = `${g.icon} <span class="font-medium text-stone-700">${g.theme}</span>`;
                btn.onclick = () => renderDetails(i, btn);
                sidebar.appendChild(btn);
            });
        }

        function renderDetails(index, btn) {
            const group = greData.synonyms[index];
            document.getElementById('synonym-details').innerHTML = `
                <div class="mb-6 border-b pb-4"><h3 class="text-2xl font-bold">${group.icon} ${group.theme}</h3></div>
                <div class="space-y-4">${group.words.map(w => `
                    <div class="p-4 rounded bg-stone-50 border">
                        <h4 class="text-xl font-bold text-sky-800 serif-font">${w.word}</h4>
                        <p class="text-stone-800 my-1">${w.def}</p>
                        <div class="text-xs bg-amber-50 p-2 border-l-4 border-amber-400 text-stone-600"><strong>Nuance:</strong> ${w.nuance}</div>
                    </div>`).join('')}
                </div>`;
        }

        function initChart() {
            const ctx = document.getElementById('themeChart').getContext('2d');
            new Chart(ctx, {
                type: 'polarArea',
                data: {
                    labels: greData.synonyms.map(g => g.theme),
                    datasets: [{ data: greData.synonyms.map(g => g.words.length), backgroundColor: ['#0ea5e9', '#f59e0b', '#10b981'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadLibrary();
            renderSynonyms();
            initChart();
            document.getElementById('searchInput').addEventListener('input', e => handleSearch(e.target.value));
            document.getElementById('mobileSearchInput').addEventListener('input', e => handleSearch(e.target.value));
        });
    </script>
</body>
</html>
