<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRE Semantic Explorer | Master Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fafaf9; color: #1c1917; }
        h1, h2, h3, .serif-font { font-family: 'Playfair Display', serif; }
        .chart-container { position: relative; width: 100%; max-width: 800px; margin: auto; height: 350px; }
        .tab-active { border-bottom: 3px solid #0369a1; color: #0369a1; font-weight: 600; }
        .tab-inactive { border-bottom: 3px solid transparent; color: #78716c; }
        .tab-inactive:hover { color: #44403c; border-bottom: 3px solid #d6d3d1; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-stone-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">🎓</span>
                <h1 class="text-xl font-bold text-stone-800 tracking-tight">GRE Semantic <span class="text-sky-700">Explorer</span></h1>
            </div>
            <div class="relative w-64 hidden md:block">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-stone-400">🔍</span>
                <input type="text" id="searchInput" placeholder="Search 1,000+ words..." class="w-full pl-10 pr-4 py-2 rounded-full border border-stone-300 bg-stone-50 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-sky-500 transition-all text-sm">
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <nav class="flex space-x-8 overflow-x-auto no-scrollbar">
                <button onclick="switchTab('overview')" id="tab-overview" class="tab-active whitespace-nowrap py-3 px-1 text-sm">📊 Overview</button>
                <button onclick="switchTab('synonyms')" id="tab-synonyms" class="tab-inactive whitespace-nowrap py-3 px-1 text-sm">🔗 Synonyms</button>
                <button onclick="switchTab('antonyms')" id="tab-antonyms" class="tab-inactive whitespace-nowrap py-3 px-1 text-sm">⚖️ Antonyms</button>
                <button onclick="switchTab('malapropisms')" id="tab-malapropisms" class="tab-inactive whitespace-nowrap py-3 px-1 text-sm">🎭 Traps</button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        
        <div id="searchResults" class="hidden mb-8 p-6 bg-sky-50 border border-sky-200 rounded-xl shadow-sm">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-sky-900">Search Results</h2>
                <button onclick="clearSearch()" class="text-sky-600 hover:text-sky-800 text-sm font-medium">✕ Clear</button>
            </div>
            <div id="searchContent" class="grid grid-cols-1 gap-4"></div>
        </div>

        <!-- Section: Overview -->
        <section id="section-overview" class="animate-fade-in">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100 flex items-center gap-4">
                    <div class="text-4xl">📚</div>
                    <div>
                        <div class="text-2xl font-bold text-stone-800" id="stat-total">0</div>
                        <div class="text-sm text-stone-500 uppercase tracking-wide">Library Words</div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100 flex items-center gap-4">
                    <div class="text-4xl">🔗</div>
                    <div>
                        <div class="text-2xl font-bold text-stone-800" id="stat-clusters">0</div>
                        <div class="text-sm text-stone-500 uppercase tracking-wide">Synonym Themes</div>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100 flex items-center gap-4">
                    <div class="text-4xl">⚖️</div>
                    <div>
                        <div class="text-2xl font-bold text-stone-800" id="stat-pairs">0</div>
                        <div class="text-sm text-stone-500 uppercase tracking-wide">Antonym Pairs</div>
                    </div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-stone-100 h-[400px]">
                <canvas id="themeChart"></canvas>
            </div>
        </section>

        <!-- Section: Synonyms -->
        <section id="section-synonyms" class="hidden animate-fade-in">
            <div class="flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/3 flex flex-col gap-2 h-[60vh] overflow-y-auto pr-2" id="synonym-sidebar"></div>
                <div class="w-full md:w-2/3 bg-white p-6 rounded-xl shadow-sm border border-stone-200 min-h-[60vh]" id="synonym-details">
                    <p class="text-center text-stone-400 mt-20">Select a theme from the left to explore clusters.</p>
                </div>
            </div>
        </section>

        <!-- Section: Antonyms -->
        <section id="section-antonyms" class="hidden animate-fade-in">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="antonym-grid"></div>
        </section>

        <!-- Section: Traps -->
        <section id="section-malapropisms" class="hidden animate-fade-in">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="malapropism-grid"></div>
        </section>
    </main>

    <script>
        const greData = {
            synonyms: [
                {
                    theme: "Criticize, Scold, or Reprove",
                    icon: "🗣️",
                    words: [
                        { word: "Castigate", def: "Reprimand harshly.", nuance: "Severe, often formal discipline." },
                        { word: "Chastise", def: "Reprimand severely.", nuance: "Often implies verbal or physical discipline." },
                        { word: "Upbraid", def: "To reproach or scold.", nuance: "Finding fault with someone." },
                        { word: "Reproach", def: "To express criticism towards.", nuance: "Blame mixed with disappointment." },
                        { word: "Censure", def: "To express strong disapproval.", nuance: "Commonly used for official/government reprimands." },
                        { word: "Excoriate", def: "To criticize very harshly.", nuance: "Stinging public disapproval." },
                        { word: "Objurgate", def: "Express strong disapproval of.", nuance: "Formal or severe scolding." },
                        { word: "Vituperate", def: "To criticize harshly; to berate.", nuance: "Savage or abusive verbal attack." },
                        { word: "Rebuke", def: "Criticize severely or angrily.", nuance: "A sharp, direct check to behavior." },
                        { word: "Denigrate", def: "Attack the good name and reputation of someone.", nuance: "Focuses on belittling or defaming." }
                    ]
                },
                {
                    theme: "Praise, Respect, or Honor",
                    icon: "🌟",
                    words: [
                        { word: "Venerate", def: "To respect deeply.", nuance: "Hallowed respect for age or tradition." },
                        { word: "Lionize", def: "Assign great social importance to.", nuance: "Treating someone like a celebrity." },
                        { word: "Exalt", def: "Praise or glorify.", nuance: "To lift up in rank or estimation." },
                        { word: "Adulate", def: "To praise excessively.", nuance: "Extreme flattery, bordering on worship." },
                        { word: "Approbatory", def: "Expressing praise or approval.", nuance: "A general state of agreement." },
                        { word: "Laudable", def: "Worthy of high praise.", nuance: "Actions that deserve commendation." },
                        { word: "Commendable", def: "Worthy of high praise.", nuance: "Standard word for praiseworthy efforts." }
                    ]
                },
                {
                    theme: "Stubborn, Inflexible, or Defiant",
                    icon: "🧱",
                    words: [
                        { word: "Obdurate", def: "Stubbornly persistent in changing an opinion.", nuance: "Hardened against feeling or persuasion." },
                        { word: "Intransigent", def: "Unwilling to change one's beliefs.", nuance: "Refusal to compromise in negotiations." },
                        { word: "Obstinate", def: "Resistant to guidance; stubbornly persistent.", nuance: "Willful adherence to an opinion." },
                        { word: "Recalcitrant", def: "Obstinately uncooperative attitude.", nuance: "Defiance of authority or discipline." },
                        { word: "Intractable", def: "Hard to control or deal with.", nuance: "Applies to both people and complex problems." },
                        { word: "Adamant", def: "Refusing to change one's mind.", nuance: "Unyielding; rooted in place." }
                    ]
                },
                {
                    theme: "Brief, Quiet, or Concise",
                    icon: "✂️",
                    words: [
                        { word: "Laconic", def: "One who says very few words.", nuance: "Brevity to the point of appearing mysterious." },
                        { word: "Terse", def: "Sparing in the use of words; abrupt.", nuance: "Often carries a negative, unfriendly tone." },
                        { word: "Pithy", def: "Concise and full of meaning.", nuance: "Brief but forcefully expressive and positive." },
                        { word: "Taciturn", def: "Habitually reserved and uncommunicative.", nuance: "A deep-seated personality trait." },
                        { word: "Reticent", def: "Reluctant to draw attention to yourself.", nuance: "Disinclined to talk, often out of caution." }
                    ]
                },
                {
                    theme: "Talkative, Wordy, or Rambling",
                    icon: "🦜",
                    words: [
                        { word: "Garrulous", def: "Full of trivial conversation.", nuance: "Rambling about unimportant matters." },
                        { word: "Loquacious", def: "Tending to talk a great deal.", nuance: "General tendency toward being talkative." },
                        { word: "Prolix", def: "Boring verbosity.", nuance: "Tedious, overly long speech or writing." },
                        { word: "Verbose", def: "Using more words than needed.", nuance: "The literal definition of 'wordy'." },
                        { word: "Voluble", def: "Talking or writing easily and continuously.", nuance: "Implies a smooth, rapid flow of speech." },
                        { word: "Maunder", def: "Speak rapidly and incessantly.", nuance: "Confused or aimless chatter." }
                    ]
                },
                {
                    theme: "Difficult, Complicated, or Hidden",
                    icon: "🧩",
                    words: [
                        { word: "Abstruse", def: "Difficult to understand; incomprehensible.", nuance: "Complex intellectual matter (e.g. physics)." },
                        { word: "Recondite", def: "Difficult to understand; obscure.", nuance: "Little known or academic subjects." },
                        { word: "Arcane", def: "Requiring secret or mysterious knowledge.", nuance: "Often implies hidden rituals or ancient info." },
                        { word: "Esoteric", def: "Understandable by only an inner circle.", nuance: "Intended for a very specific, limited audience." },
                        { word: "Inscrutable", def: "Not easily understood; unfathomable.", nuance: "Impossible to read (often used for expressions)." },
                        { word: "Opaque", def: "Not clearly understood or expressed.", nuance: "Meaning that is blocked or not transparent." }
                    ]
                },
                {
                    theme: "Wealthy, Generous, or Abundant",
                    icon: "💰",
                    words: [
                        { word: "Affluent", def: "Wealthy.", nuance: "Possessing material riches." },
                        { word: "Munificent", def: "Very generous (with money).", nuance: "Lavish giving, often to others." },
                        { word: "Largess", def: "Extreme generosity and giving.", nuance: "The act of being a benefactor." },
                        { word: "Magnanimous", def: "Noble and generous in spirit.", nuance: "Generosity toward a rival or lesser person." },
                        { word: "Copious", def: "In abundant supply.", nuance: "A large quantity of something." },
                        { word: "Replete", def: "Completely stocked or furnished.", nuance: "Being full of something good." }
                    ]
                },
                {
                    theme: "Poor, Greedy, or Stingy",
                    icon: "📉",
                    words: [
                        { word: "Destitute", def: "Poor enough to need help from others.", nuance: "Lacking the basic necessities of life." },
                        { word: "Indigent", def: "Poor; having very little.", nuance: "A state of needing assistance." },
                        { word: "Impecunious", def: "Lacking money; poor.", nuance: "Habitually having no money." },
                        { word: "Penurious", def: "Lacking money; miserly.", nuance: "Can mean both poor or extremely stingy." },
                        { word: "Parsimonious", def: "Extremely frugal; miserly.", nuance: "Unwilling to spend any money." },
                        { word: "Avarice", def: "Greed.", nuance: "One of the 'deadly sins' of greed." },
                        { word: "Pittance", def: "A small amount (of money).", nuance: "An inadequate, tiny payment." }
                    ]
                },
                {
                    theme: "Harmful, Destructive, or Evil",
                    icon: "⚠️",
                    words: [
                        { word: "Deleterious", def: "Harmful to living things.", nuance: "Causing injury or damage." },
                        { word: "Pernicious", def: "Exceedingly harmful.", nuance: "Harm that spreads in a hidden, subtle way." },
                        { word: "Inimical", def: "Hostile.", nuance: "Conditions/environments that oppose life." },
                        { word: "Detrimental", def: "Causing harm or injury.", nuance: "General word for being damaging." },
                        { word: "Diabolical", def: "Extremely wicked; like the devil.", nuance: "Maliciously evil plans." },
                        { word: "Malevolent", def: "Wishing evil to others.", nuance: "Rooted in intense ill-will." },
                        { word: "Fell", def: "Terribly evil.", nuance: "Used for villains or lethal forces." }
                    ]
                },
                {
                    theme: "Bold, Brave, or Courageous",
                    icon: "⚔️",
                    words: [
                        { word: "Intrepid", def: "Fearless.", nuance: "Brave in the face of danger." },
                        { word: "Audacious", def: "Willing to be bold or take risks.", nuance: "Can imply either bravery or social rudeness." },
                        { word: "Doughty", def: "Brave; bold; courageous.", nuance: "Often used for a persistent, gritty hero." },
                        { word: "Mettlesome", def: "Filled with courage or valor.", nuance: "Having a resilient, spirited nature." },
                        { word: "Plucky", def: "Marked by courage and determination.", nuance: "Often used for an underdog or small fighter." }
                    ]
                }
            ],
            antonyms: [
                { pair: ["Mitigate", "Exacerbate"], concept: "Severity", w1: "Make less severe.", w2: "Make worse.", ex: "The ice served to mitigate the swelling, while the heat only exacerbated it." },
                { pair: ["Auspicious", "Sinister"], concept: "Omens", w1: "Favorable.", w2: "Evil; threatening.", ex: "The bright sun was an auspicious start, but the dark clouds looked sinister." },
                { pair: ["Munificent", "Parsimonious"], concept: "Spending", w1: "Very generous.", w2: "Extremely frugal/miserly.", ex: "The munificent donor gave millions, while the parsimonious heir saved every cent." },
                { pair: ["Arduous", "Facile"], concept: "Difficulty", w1: "Demanding great effort.", w2: "Arrived at without effort; lacking depth.", ex: "Climbing Everest is arduous, but the tour guide's explanation was facile." },
                { pair: ["Ephemeral", "Perennial"], concept: "Duration", w1: "Lasting a short time.", w2: "Lasting an indefinitely long time.", ex: "Fashion trends are ephemeral, but the search for truth is perennial." },
                { pair: ["Pellucid", "Arcane"], concept: "Clarity", w1: "Transparently clear.", w2: "Secret or mysterious.", ex: "The prose was pellucid, making the arcane scientific law easy to grasp." }
            ],
            malapropisms: [
                { word: "Enervate", sounds: "Energize", real: "To sap energy from.", ex: "The sun did not energize him; it enervated him." },
                { word: "Restive", sounds: "Restful", real: "Restless; unruly under authority.", ex: "The crowd grew restive after three hours." },
                { word: "Ingenuous", sounds: "Ingenious", real: "Naive and innocent.", ex: "Her ingenuous belief in strangers made her a target." },
                { word: "Demur", sounds: "Demure", real: "To object or show reluctance.", ex: "He demurred when asked to work on Sunday." },
                { word: "Equivocal", sounds: "Equivalent", real: "Confusing or ambiguous.", ex: "The test results were equivocal; we weren't sure what they meant." },
                { word: "Venal", sounds: "Venial", real: "Susceptible to bribes; corrupt.", ex: "The venal official was easily bought." },
                { word: "Prosaic", sounds: "Pros (Good)", real: "Dull and lacking imagination.", ex: "His prosaic mosaic was quite boring." }
            ]
        };

        let masterLibrary = [];

        async function loadLibrary() {
            try {
                const response = await fetch('words.json');
                masterLibrary = await response.json();
                document.getElementById('stat-total').innerText = masterLibrary.length;
            } catch (e) { console.warn("words.json not found."); }
        }

        function switchTab(tabId) {
            ['overview', 'synonyms', 'antonyms', 'malapropisms'].forEach(id => {
                document.getElementById(`section-${id}`).classList.add('hidden');
                document.getElementById(`tab-${id}`).className = 'tab-inactive whitespace-nowrap py-3 px-1 text-sm';
            });
            document.getElementById(`section-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).className = 'tab-active whitespace-nowrap py-3 px-1 text-sm';
        }

        function renderAntonyms() {
            const grid = document.getElementById('antonym-grid');
            grid.innerHTML = greData.antonyms.map(a => `
                <div class="bg-white border rounded-xl p-5 shadow-sm">
                    <div class="text-xs font-bold text-stone-400 uppercase mb-3">Concept: ${a.concept}</div>
                    <div class="grid grid-cols-2 gap-4 border-b pb-4 mb-4">
                        <div><div class="text-emerald-600 font-bold">${a.pair[0]}</div><div class="text-sm text-stone-500">${a.w1}</div></div>
                        <div class="text-right"><div class="text-rose-600 font-bold">${a.pair[1]}</div><div class="text-sm text-stone-500">${a.w2}</div></div>
                    </div>
                    <p class="text-xs italic text-stone-600">"${a.ex}"</p>
                </div>
            `).join('');
            document.getElementById('stat-pairs').innerText = greData.antonyms.length;
        }

        function renderMalapropisms() {
            const grid = document.getElementById('malapropism-grid');
            grid.innerHTML = greData.malapropisms.map(m => `
                <div class="bg-white border rounded-xl p-6 shadow-sm relative">
                    <div class="absolute top-2 right-2 bg-red-100 text-red-700 text-[10px] font-bold px-2 py-0.5 rounded">TRAP</div>
                    <h4 class="text-xl font-bold mb-2">${m.word}</h4>
                    <div class="text-sm mb-2"><span class="text-stone-400">Not:</span> <span class="line-through">${m.sounds}</span></div>
                    <div class="bg-sky-50 p-3 rounded text-sm text-sky-800 mb-3"><strong>Meaning:</strong> ${m.real}</div>
                    <p class="text-xs italic text-stone-500">"${m.ex}"</p>
                </div>
            `).join('');
        }

        function renderSynonyms() {
            const sidebar = document.getElementById('synonym-sidebar');
            greData.synonyms.forEach((g, i) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left px-4 py-3 rounded-lg border bg-white hover:bg-sky-50 mb-2 transition-all';
                btn.innerHTML = `${g.icon} <span class="font-medium">${g.theme}</span>`;
                btn.onclick = () => {
                    document.getElementById('synonym-details').innerHTML = `
                        <h3 class="text-2xl font-bold mb-6">${g.icon} ${g.theme}</h3>
                        <div class="space-y-4">${g.words.map(w => `
                            <div class="p-4 rounded border bg-stone-50">
                                <div class="font-bold text-sky-800 text-lg">${w.word}</div>
                                <div class="text-stone-700 my-1">${w.def}</div>
                                <div class="text-xs text-stone-400"><strong>Nuance:</strong> ${w.nuance}</div>
                            </div>
                        `).join('')}</div>
                    `;
                };
                sidebar.appendChild(btn);
            });
            document.getElementById('stat-clusters').innerText = greData.synonyms.length;
        }

        function initChart() {
            const ctx = document.getElementById('themeChart').getContext('2d');
            new Chart(ctx, {
                type: 'polarArea',
                data: {
                    labels: greData.synonyms.map(g => g.theme),
                    datasets: [{ data: greData.synonyms.map(g => g.words.length), backgroundColor: ['#0ea5e9', '#f59e0b', '#10b981', '#6366f1', '#f43f5e', '#8b5cf6', '#14b8a6', '#f97316', '#a8a29e', '#0f172a'] }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        window.onload = () => {
            loadLibrary();
            renderSynonyms();
            renderAntonyms();
            renderMalapropisms();
            initChart();
        };

        function clearSearch() {
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchInput').value = '';
        }

        document.getElementById('searchInput').oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const panel = document.getElementById('searchResults');
            if (query.length < 2) { panel.classList.add('hidden'); return; }
            panel.classList.remove('hidden');
            const matches = masterLibrary.filter(w => w.word.toLowerCase().includes(query)).slice(0, 10);
            document.getElementById('searchContent').innerHTML = matches.map(m => `
                <div class="bg-white p-4 border rounded shadow-sm">
                    <div class="font-bold">${m.word} (${m.pos})</div>
                    <div class="text-sm">${m.def}</div>
                </div>
            `).join('') || '<p class="text-stone-500">No results found in library.</p>';
        };
    </script>
</body>
</html>
